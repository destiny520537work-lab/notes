<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap">
<style>
:root{--paper:#FFFFFF;--ink:#15141A;--ink-2:#2A2830;--ink-4:#6A6674;--rule:#DADCE0;--rule-2:#E8EAED;--accent:#7A1A1A;--link-line:rgba(122,26,26,.38);--serif:'Newsreader','Noto Serif SC','Songti SC',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif)}
main{max-width:720px;margin:0 auto;padding:60px clamp(20px,4vw,56px) 96px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-4);margin-bottom:22px}
h1{font-weight:400;font-size:clamp(36px,4.6vw,52px);line-height:1.12;letter-spacing:-.02em;margin:0 0 18px}
p{font-size:18px;line-height:1.75;color:var(--ink-2);margin:0 0 28px}
ol{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--rule-2);font-size:18px;line-height:1.6}
li time{font-family:var(--mono);font-size:12.5px;color:var(--ink-4);padding-top:6px}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--link-line)}a:hover{color:var(--accent);border-bottom-color:var(--accent)}
</style></head><body><main>

</main></body></html>
